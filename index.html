function ven(){const t=sum(L('ven'),x=>+x.price||0),p=sum(L('ven'),x=>+x.paid||0);
return`<div class="top"><h2>Vendor</h2>${add('ven')}</div><div class="sum"><div><small>Total biaya</small><b>${R(t)}</b></div><div><small>Dibayar</small><b>${R(p)}</b></div><div><small>Sisa</small><b>${R(t-p)}</b></div></div>
${L('ven').length?'':'<p class="empty">Belum ada vendor. Ketuk Tambah untuk mulai.</p>'}<div class="cards">${L('ven').map(x=>`<div class="c" data-a="edit" data-k="ven" data-i="${x.id}" tabindex="0"><div class="row" style="padding:0"><small>${E(x.cat)}</small><span class="chip ${ST[x.status]}">${x.status}</span></div><h3 style="margin:4px 0">${E(x.name)||'<span style="color:var(--mut)">Belum dipilih</span>'}</h3><small>${E(x.contact)||'Kontak belum diisi'}${x.pic?' · '+E(x.pic):''}</small>${x.pkg?`<div><small>${E(x.pkg)}</small></div>`:''}${x.price?`<div class="row" style="padding:8px 0 0"><span>${R(x.paid)} / ${R(x.price)}</span><span>${fd(x.date)}</span></div>${bar(Math.min(100,x.paid/x.price*100))}`:''}</div>`).join('')}</div>`}
function doc(){const o={Belum:0,Proses:1,Selesai:2},a=[...L('doc')].sort((x,y)=>o[x.status]-o[y.status]),cl={Belum:'p',Proses:'w',Selesai:'g'};
return`<div class="top"><h2>Dokumen</h2>${add('doc')}</div><div class="sum"><div><small>Selesai</small><b>${prog('doc')[0]} dari ${prog('doc')[1]}</b></div></div><details open style="padding:0">${a.map(x=>{const n=days(x.due);return`<div class="r" style="grid-template-columns:1fr auto auto;border-top:0;border-bottom:1px solid var(--line)"><div class="m"><b>${E(x.name)}</b><small>${x.who}${x.where?' · '+E(x.where):''}${x.due?` · <span class="${n<0&&x.status!='Selesai'?'late':''}">${fd(x.due)}</span>`:''}${x.note?' · '+E(x.note):''}</small></div><button class="chip ${cl[x.status]}" data-a="cyc" data-i="${x.id}" title="Ketuk untuk ganti status">${x.status}</button><button class="ic" data-a="edit" data-k="doc" data-i="${x.id}">✎</button></div>`}).join('')}</details>`}
function task(){const a=[...L('task')].sort((x,y)=>(x.done-y.done)||((x.due||'9')<(y.due||'9')?-1:1));
return`<div class="top"><h2>Tugas</h2>${add('task')}</div><details open>${a.map(x=>{const n=days(x.due);return`<div class="r ${x.done?'d':''}" style="grid-template-columns:24px 1fr auto"><input type="checkbox" data-a="tog" data-k="task" data-i="${x.id}" ${x.done?'checked':''} aria-label="Selesai"><div class="m"><b>${E(x.name)}</b><small>${x.ev}${x.pri&&x.pri!='Biasa'?' · '+x.pri:''}${x.pic?' · '+E(x.pic):''}${x.due?` · <span class="${n<0&&!x.done?'late':''}">${fd(x.due)}</span>`:''}</small></div><button class="ic" data-a="edit" data-k="task" data-i="${x.id}">✎</button></div>`}).join('')}</details>`}
function guest(){const a=L('guest'),n=a.length,pax=sum(a,x=>+x.pax||0),hd=sum(a.filter(x=>x.status=='Hadir'),x=>+x.pax||0),gs=[...new Set(a.map(x=>x.cat))];
return`<div class="top"><h2>Tamu</h2>${add('guest')}</div><div class="sum"><div><small>Undangan</small><b>${n}</b></div><div><small>Total orang</small><b>${pax}</b></div><div><small>Konfirmasi hadir</small><b>${hd}</b></div></div>${n?gs.map(c=>{const l=a.filter(x=>x.cat==c);return`<details open><summary><span>${E(c)||'Tanpa kelompok'}</span><small>${sum(l,x=>+x.pax||0)} orang</small></summary>${l.map(x=>`<div class="r" style="grid-template-columns:1fr auto auto"><div class="m"><b>${E(x.name)}</b><small>${x.pax||1} orang${x.contact?' · '+E(x.contact):''}${x.note?' · '+E(x.note):''}</small></div><span class="chip ${GC[x.status]}">${x.status}</span><button class="ic" data-a="edit" data-k="guest" data-i="${x.id}">✎</button></div>`).join('')}</details>`}).join(''):'<p class="empty">Belum ada tamu. Ketuk Tambah untuk mulai.</p>'}`}
const VIEWS={home,ses,ven,doc,task,guest};
function draw(){$('#nav').innerHTML='<div class="seg">'+[['lamaran','Persiapan Lamaran'],['wedding','Persiapan Wedding']].map(([k,l])=>`<button class="${k==P?'on':''}" data-a="ph" data-v="${k}">${l}</button>`).join('')+'</div><div class="tabs">'+TABS.map(([k,l])=>`<button class="${k==V?'on':''}" data-a="nav" data-v="${k}">${IC[k]}<span>${l}</span></button>`).join('')+'</div>';$('#app').innerHTML=VIEWS[V]()}
function field([k,l,t,o],v){const id='f_'+k;if(k=='cat'||k=='brand')return combo(k,l,v,k=='cat'?catsOf(CK):[...new Set(D.ses.map(x=>x.brand).filter(Boolean))]);if(t=='select')return`<label>${l}<select name="${k}">${o.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('')}</select></label>`;
const ls=k=='cat'?` list="cats"`:'';return`<label>${l}<input name="${k}" type="${t||'text'}" value="${E(v)}"${ls} ${t=='number'?'min="0" inputmode="numeric"':''}></label>`}
function form(k,i){CK=k;const c=S[k],o=i?get(k,i):{...c.n},cats=[];
$('#dlg').innerHTML=`<form id="fm"><h3 style="font-size:26px">${i?'Ubah':'Tambah'} ${{ses:'item seserahan',ven:'vendor',doc:'dokumen',task:'tugas',guest:'tamu'}[k]}</h3>${c.f.map(f=>field(f,o[f[0]]??'')).join('')}<datalist id="cats">${cats.map(x=>`<option value="${E(x)}">`).join('')}</datalist>
<div class="fb">${i?'<button type="button" class="btn o" id="del" style="margin-right:auto">Hapus</button>':''}<button type="button" class="btn o" id="cx">Batal</button><button class="btn">Simpan</button></div></form>`;
$('#dlg').showModal();$('#cx').onclick=()=>$('#dlg').close();
if(i)$('#del').onclick=function(){if(this.dataset.s){D[k]=D[k].filter(x=>x.id!=i);save();$('#dlg').close();draw();toast('Dihapus')}else{this.dataset.s=1;this.textContent='Yakin hapus?';this.className='btn x'}};
$('#fm').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));c.f.forEach(([n,,t])=>{if(t=='number')d[n]=+d[n]||0});
if(i)Object.assign(o,d);else D[k].push({id:uid(),done:false,ph:P,...d});save();$('#dlg').close();draw();toast(i?'Perubahan disimpan':'Berhasil ditambahkan')}}
function settings(){const s=D.s;$('#dlg').innerHTML=`<form id="fm"><h3 style="font-size:26px">Nama dan tanggal</h3>${[['a','Nama calon pengantin pria'],['b','Nama calon pengantin wanita'],['lam','Tanggal lamaran','date'],['pre','Tanggal prewedding','date'],['akad','Tanggal akad','date'],['res','Tanggal resepsi','date']].map(f=>field(f,s[f[0]])).join('')}
<label>Cadangan data (salin dan simpan, atau tempel untuk memulihkan)<textarea id="bk" rows="3"></textarea></label>
<div class="fb"><button type="button" class="btn o" id="exp" style="margin-right:auto">Buat cadangan</button><button type="button" class="btn o" id="imp">Pulihkan</button><button class="btn">Simpan</button></div></form>`;
$('#dlg').showModal();$('#exp').onclick=()=>{const t=$('#bk');t.value=JSON.stringify(D);t.select();try{navigator.clipboard.writeText(t.value)}catch(e){}};
$('#imp').onclick=()=>{try{const x=JSON.parse($('#bk').value);if(x.ses&&x.s){D=x;save();$('#dlg').close();draw()}}catch(e){$('#bk').value=''; $('#bk').placeholder='Format cadangan tidak valid'}};
$('#fm').onsubmit=e=>{e.preventDefault();Object.assign(D.s,Object.fromEntries(new FormData(e.target)));save();$('#dlg').close();draw()}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const{a,k,i,v}=t.dataset;
if(a=='ph'){P=v;D.p=v;save();draw()}else if(a=='nav'){V=v;draw();scrollTo(0,0)}else if(a=='tog'){get(k,i).done=t.checked;save();draw()}else if(a=='edit')form(k,i);else if(a=='new')form(k);else if(a=='set')settings();
else if(a=='cyc'){const o=get('doc',i),L=['Belum','Proses','Selesai'];o.status=L[(L.indexOf(o.status)+1)%3];save();draw()}});
document.addEventListener('input',e=>{if(e.target.id=='q'){q=e.target.value;$('#sl').innerHTML=sesList()}});
document.addEventListener('change',e=>{if(e.target.id=='pend'){pend=e.target.checked;$('#sl').innerHTML=sesList()}});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.matches('.cards .c'))e.target.click()});
function combo(n,l,v,o){return`<label>${l}<div class="cb"><input name="${n}" value="${E(v)}" autocomplete="off" placeholder="${o.length?'Pilih atau ketik baru':'Ketik di sini'}" data-cb="${E(JSON.stringify(o))}"><span class="cv">▾</span><div class="dd" hidden></div></div></label>`}
function dd(el,all){const o=JSON.parse(el.dataset.cb),v=el.value.trim().toLowerCase(),m=all?o:o.filter(x=>x.toLowerCase().includes(v)),b=el.parentNode.querySelector('.dd');b.innerHTML=m.map(x=>`<div class="o" data-v="${E(x)}">${E(x)}</div>`).join('');b.hidden=!m.length}
document.addEventListener('focusin',e=>{if(e.target.dataset&&e.target.dataset.cb)dd(e.target,1)});
document.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.cb)dd(e.target,0)});
document.addEventListener('focusout',e=>{if(e.target.dataset&&e.target.dataset.cb)e.target.parentNode.querySelector('.dd').hidden=true});
document.addEventListener('pointerdown',e=>{const o=e.target.closest('.dd .o');if(o){e.preventDefault();o.closest('.cb').querySelector('input').value=o.dataset.v;o.parentNode.hidden=true}});
function toast(t){let e=$('#ts');if(!e){e=document.createElement('div');e.id='ts';document.body.appendChild(e)}e.textContent=t;e.className='show';clearTimeout(e.t);e.t=setTimeout(()=>e.className='',2000)}
const sv=p=>`<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const IC={home:sv('<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'),ses:sv('<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M5 12v9h14v-9M12 8H8a2.5 2.5 0 1 1 0-5c2 0 4 2.5 4 5zm0 0h4a2.5 2.5 0 1 0 0-5c-2 0-4 2.5-4 5z"/>'),ven:sv('<path d="M4 9l1-5h14l1 5M4 9v11h16V9M4 9c0 2 3 2 4 0 1 2 3 2 4 0 1 2 3 2 4 0 1 2 4 2 4 0M9 20v-6h6v6"/>'),doc:sv('<path d="M6 3h8l4 4v14H6zM14 3v4h4M9 13h6M9 17h6"/>'),task:sv('<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>'),guest:sv('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-4 3-6 6.5-6s6.5 2 6.5 6M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2.5.7 3.5 2.7 3.5 6"/>')};
draw();
</script></body></html>
